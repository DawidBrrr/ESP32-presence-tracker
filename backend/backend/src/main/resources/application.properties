spring.application.name=presence-tracker-backend
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:presence-tracker-backend}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false
kafka.telemetry-topic=${KAFKA_TELEMETRY_TOPIC:telemetry}
influx.url=${INFLUX_URL:http://influxdb:8086}
influx.org=${INFLUX_ORG:presence}
influx.bucket=${INFLUX_BUCKET:telemetry}
influx.token=${INFLUX_TOKEN}
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:presence_tracker}}
spring.datasource.username=${POSTGRES_USER:presence}
spring.datasource.password=${POSTGRES_PASSWORD:presence}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
device.registration.token=${DEVICE_REGISTRATION_TOKEN}
